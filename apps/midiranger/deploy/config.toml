# MidiRanger appliance configuration — /etc/midiranger/config.toml
#
# Deployment state only. Everything musical (routes-as-played, arps, scenes)
# lives in the project file under [paths] data_dir, so this file can be
# copied between units without dragging somebody's set along with it.
#
# The install stage rewrites width/height and the paths for the panel it is
# building for; the rest is yours to edit. Restart after changing anything
# here:  sudo systemctl restart midiranger

[display]
# The reference panel is the 1280x400 HDMI bar. The GUI derives its whole
# layout from these two numbers — a portrait 480x800 gets stacked chrome
# instead of side rails, with nothing else to configure.
width = 1280
height = 400
fullscreen = true
# industrial (the design system's palette, dark) | night | daylight
# daylight is the old light scheme — use it if this panel's black is
# too shallow to separate industrial's three near-black surfaces.
theme = "industrial"
fps = 60

[paths]
# Must be writable by the service user. The install stage creates these.
data_dir = "/var/lib/midiranger"
presets_dir = "/var/lib/midiranger/presets"

[midi]
# auto tries mido/python-rtmidi (the ALSA sequencer) and degrades to a silent
# null backend rather than refusing to boot. The SET screen says which one is
# in force and what each endpoint is bound to.
backend = "auto"
# Sending MIDI clock (24 ppq) with the transport. Off by default: a box that
# starts clocking the moment it boots will surprise whatever is downstream.
clock_out = false

[routing]
# The boot-time matrix, until a project or scene replaces it. Endpoints:
# trs_a_in/out, trs_b_in/out (Pimidi), din_in/out (Pisound), usb_in/out.
# channel -1 = all channels; to_channel -1 = keep the incoming channel.
routes = [
  { src = "din_in", dst = "din_out", channel = -1, to_channel = -1 },
  { src = "usb_in", dst = "din_out", channel = -1, to_channel = -1 },
]

[clock]
# internal | midi — "midi" follows incoming 0xF8 on the bound inputs.
source = "internal"
pll_smooth = 0.2
dropout_ms = 1000.0

[engine]
# SCHED_FIFO priority for the tick thread. The unit grants the capability;
# 0 leaves scheduling alone (which is right on a dev box and wrong on stage).
rt_priority = 40

[button]
# The PiSound button, bridged over a Unix socket because pisound-btn runs its
# scripts as root under the system Python and the app runs as its own user
# inside a venv. /run/midiranger is created by the unit's RuntimeDirectory=.
enabled = true
socket = "/run/midiranger/button.sock"

[button.map]
# Gesture -> action. Actions: play_stop, record_toggle, bypass, next_scene,
# save_project, panic, nothing. An unknown name is dropped with a log line,
# not a crash.
CLICK_1 = "play_stop"
CLICK_2 = "bypass"
CLICK_3 = "next_scene"
HOLD_1S = "save_project"
HOLD_5S = "panic"

[pots]
# Where the two panel pots come from: "midi_cc" (a pot box speaking MIDI —
# use LEARN on the SET screen), "socket" (/run/midiranger/pots.sock, for a
# future ADC daemon), or "none".
source = "midi_cc"
cc_a = 20
cc_b = 21
# -1 = any channel
channel = -1

[pots.map]
# What each pot turns: arp_probability, arp_gate, humanize, echo_decay,
# morph, nothing.
POT_A = "arp_probability"
POT_B = "humanize"
