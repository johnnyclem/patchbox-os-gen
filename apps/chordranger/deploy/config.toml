# ChordRanger appliance configuration — /etc/chordranger/config.toml
#
# Deployment state only. Everything musical (chords, style, song, tempo) lives
# in the project file under [paths] data_dir, so this file can be copied
# between units without dragging somebody's tune along with it.
#
# The install stage (stage3/11-install-chordranger) rewrites width/height and
# the paths for the panel it is building for; the rest is yours to edit.
# Restart after changing anything here:  sudo systemctl restart chordranger

[display]
# The reference panel is the 1280x400 HDMI bar. The GUI derives its whole
# layout from these two numbers — a portrait 480x800 gets stacked chrome
# instead of side rails, with nothing else to configure.
width = 1280
height = 400
fullscreen = true
# industrial (the design system's palette, dark) | night | daylight
# daylight is the old light scheme — use it if this panel's black is
# too shallow to separate industrial's three near-black surfaces.
theme = "industrial"
fps = 60

[paths]
# Must be writable by the service user. The install stage creates these.
data_dir = "/var/lib/chordranger"
presets_dir = "/var/lib/chordranger/presets"

[midi]
# auto tries mido/python-rtmidi (the ALSA sequencer) and degrades to a silent
# null backend rather than refusing to boot. The Settings screen says which
# one is in force and what it is bound to.
backend = "auto"
# Matched as a case-insensitive substring against the port names, so "pisound"
# finds it whichever ALSA client number it landed on this boot. Leave empty to
# take the first port in `prefer`.
out_port = ""
in_port = ""
# Order matters: pisound first because on this appliance that is the DIN
# socket. "Midi Through" is last precisely because it is always present and
# would otherwise win every time and play to nobody.
prefer = ["pisound", "f_midi", "usb", "midi through"]
# Send MIDI clock with the transport. Off by default: a box that starts
# clocking the moment it boots will surprise whatever is downstream.
clock_out = false

[clock]
# internal | midi — "midi" follows incoming 0xF8 from in_port.
source = "internal"
pll_smooth = 0.2
dropout_ms = 1000.0

[engine]
# SCHED_FIFO priority for the tick thread. The unit grants the capability;
# 0 leaves scheduling alone (which is right on a dev box and wrong on stage).
rt_priority = 40
# Ticks of delay between the voices of a strummed chord. 0 = block chords.
strum_ticks = 0
# Sound a chord when a pad is tapped with the transport stopped.
audition = true

[button]
# The PiSound button, bridged over a Unix socket because pisound-btn runs its
# scripts as root under the system Python and the app runs as its own user
# inside a venv. /run/chordranger is created by the unit's RuntimeDirectory=.
enabled = true
socket = "/run/chordranger/button.sock"

[button.map]
# Gesture -> action. Actions: play_stop, record_toggle, next_section,
# prev_section, save_project, next_style, next_chordset, panic, metronome,
# nothing. An unknown name is dropped with a log line, not a crash.
CLICK_1 = "play_stop"
CLICK_2 = "record_toggle"
CLICK_3 = "next_section"
HOLD_1S = "save_project"
HOLD_3S = "next_style"
HOLD_5S = "panic"
