# Prefer libinput for the Waveshare Goodix capacitive panel.
# Identity matching is best-effort; Screen Configuration can still re-bind touch.
Section "InputClass"
	Identifier "Waveshare Goodix touch"
	MatchIsTouchscreen "on"
	MatchDevicePath "/dev/input/event*"
	Driver "libinput"
	Option "CalibrationMatrix" "1 0 0 0 1 0 0 0 1"
EndSection
