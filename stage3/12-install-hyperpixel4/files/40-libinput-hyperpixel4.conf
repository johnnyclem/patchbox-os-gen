# HyperPixel 4 rectangular — Goodix capacitive touch (X11 / LightDM only).
# kmsdrm path uses evdev directly; see 99-hyperpixel4-touch.rules + hwdb.
Section "InputClass"
	Identifier "HyperPixel4 Goodix"
	MatchProduct "Goodix"
	MatchIsTouchscreen "on"
	MatchDevicePath "/dev/input/event*"
	Driver "libinput"
	# Landscape "left" default — keep in sync with stage 12 HYPERPIXEL_ROTATE
	Option "CalibrationMatrix" "0 -1 1 1 0 0 0 0 1"
EndSection
