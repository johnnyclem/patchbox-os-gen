# Prefer RaspiAudio / voiceHAT / WM8960 class I2S cards for default PCM.
# Card names vary by overlay; these pcm.!default rules use type plug so
# JACK/apps can still open "default" after the HAT is present.
#
# After first boot, `aplay -l` shows the real name — adjust if needed.

pcm.!default {
	type plug
	slave.pcm {
		type hw
		card 0
	}
}

ctl.!default {
	type hw
	card 0
}
