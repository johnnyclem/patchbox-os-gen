# Realtime scheduling privileges for the audio group (Patchbox OS).
# jackd2's own postinst (see 00-debconf: jackd/tweak_rt_limits=true) writes
# a similar /etc/security/limits.d/audio.conf, but that file is only
# regenerated on jackd2 install/reconfigure. This file is explicit,
# in-repo, and takes priority (sorts after audio.conf).
@audio - rtprio 95
@audio - memlock unlimited
@audio - nice -19
